name: Sync fork with upstream

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync quattro from upstream
        uses: actions/github-script@v8
        with:
          script: |
            const result = await github.rest.repos.mergeUpstream({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "quattro"
            });

            core.info(`Sync result: ${result.data.merge_type || "already up to date"}`);
